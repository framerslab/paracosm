# Dependabot config for paracosm.
#
# Adding this file ensures that when dependabot opens PRs for dependency
# bumps it includes the corresponding lockfile change. Previously the
# `chore(deps): bump @framers/agentos` PRs updated package.json alone
# and the deploy workflow's `npm ci` step broke on merge; the CI
# preflight in deploy.yml now catches the desync but dependabot PRs
# should not create the desync in the first place.
#
# Grouping @framers/* + @wilds/* into a single daily PR reduces review
# load: an agentos bump usually lands together with coordinated bumps
# in the sibling framers/wilds packages.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    groups:
      framers:
        patterns:
          - "@framers/*"
          - "@wilds/*"
    ignore:
      # TypeScript 7 ships no compiler API, and typedoc 0.28 needs the 6.x
      # one (its typescript peer range ends at 6.0.x). Remove this once a
      # typedoc release supports TypeScript 7 (TypeStrong/typedoc#3098).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "npm"
    directory: "/src/dashboard"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    versioning-strategy: "increase"
    groups:
      # react-dom throws "Incompatible React versions" unless react is the
      # same version, so the four move in one pull request.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
    ignore:
      # TypeScript 7 ships no compiler API, and typedoc 0.28 needs the 6.x
      # one (its typescript peer range ends at 6.0.x). Remove this once a
      # typedoc release supports TypeScript 7 (TypeStrong/typedoc#3098).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

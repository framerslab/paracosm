name: Measure scenarios

# Measurement only. Runs on pushes to its own branch and is never merged.
on:
  push:
    branches: ['measure/scenario-streams']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: measure-scenarios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measure ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [describe, streams, two-events, hash, chances, marks]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Measure
        env:
          PART: ${{ matrix.part }}
        run: npx tsx scripts/measure-scenarios.ts

  guard:
    name: Guard test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Two opposite decision streams end differently in every scenario
        run: node --import tsx --import ./scripts/test-css-stub.mjs --test tests/runtime/scenario-leaders-end-differently.test.ts

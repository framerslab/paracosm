name: CI

# Builds and tests every pull request. The deploy workflow's build job runs
# the same steps on a push to master before it deploys, so a change to the
# steps here belongs in deploy.yml too. The exception is the PDF upload
# end-to-end test: Playwright's web server rebuilds src/dashboard/dist without
# the analytics settings deploy.yml builds with, and deploy.yml uploads that
# directory, so the test runs here only. The packed-package check runs here
# and in deploy.yml's package-check job, which packs the tarball the publish
# job ships and checks those bytes, also reinstalled from their lockfile on
# Node 22 with no toolchain.
#
# The weekly bump workflow dispatches CI on its pull request branch, because
# GitHub holds the pull_request runs of a pull request that GITHUB_TOKEN opens
# until a maintainer approves them.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its run; dispatched runs queue, since the bump
  # workflow waits for the run it dispatched and posts its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # The version deploy.yml builds with; its env block says why.
          node-version: '24'

      - name: Guard against pnpm-workspace contamination in lockfiles
        run: |
          set -e
          fail=0
          for f in package-lock.json src/dashboard/package-lock.json; do
            if [ ! -f "$f" ]; then continue; fi
            if grep -q 'node_modules/\.pnpm/' "$f"; then
              echo "::error file=$f::Lockfile contains 'node_modules/.pnpm/'. It was written inside a pnpm workspace and npm ci cannot install from it. Regenerate it with npm in a plain clone."
              fail=1
            fi
          done
          exit $fail

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript (engine + runtime)
        run: npm run build

      - name: Install dashboard dependencies
        run: cd src/dashboard && npm ci

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Run tests
        run: npm test

      # Packs the package, installs the tarball into an empty project, starts
      # paracosm-dashboard and requests the landing page, the dashboard and
      # their assets (scripts/smoke-packed-package.mjs).
      - name: Check the packed package
        run: npm run check:package

      # The same check on Node 22 in an image with no make, compiler or Python,
      # after reinstalling the project from the lockfile its install wrote with
      # npm ci, as deploy.yml's package-check runs it before a publish.
      - name: Check the packed package reinstalled from its lockfile on Node 22 with no toolchain
        run: |
          node scripts/pack-dashboard.mjs
          mkdir -p "$RUNNER_TEMP/package"
          tarball=$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/package" \
            | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename)")
          docker run --rm \
            -v "$RUNNER_TEMP/package:/package:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            node:22-bookworm-slim \
            node /scripts/smoke-packed-package.mjs --tarball "/package/$tarball" --reinstall-from-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: PDF upload end-to-end test
        run: npx playwright test tests-e2e/specs/pdf-upload.spec.ts --project=chromium-desktop

      - name: Check doc examples compile against package
        run: npm run check:doc-examples

      - name: Build API docs (TypeDoc)
        run: npm run docs

      - name: Check the sitemap against the API docs
        run: npm run check:sitemap

  # The install the server runs after a deploy, as deploy.yml's server-install
  # job runs it: the production dependencies from the lockfile on Node 22, in
  # an image with no make, compiler or Python.
  server-install:
    name: Server install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:22-bookworm-slim
    steps:
      # The image has no git; checkout downloads the commit through the API.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install production dependencies from the lockfile, as the server does
        run: npm ci --omit=dev --no-audit --no-fund

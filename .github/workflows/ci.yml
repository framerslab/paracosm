name: CI

# Builds and tests every pull request. The deploy workflow's build job runs
# the same steps on a push to master before it deploys, so a change to the
# steps here belongs in deploy.yml too. The exception is the end-to-end
# tests: Playwright's web server rebuilds src/dashboard/dist without the
# analytics settings deploy.yml builds with, and deploy.yml uploads that
# directory, so they run here only. The packed-package check runs here
# and in deploy.yml's package-check job, which packs the tarball the publish
# job ships and checks those bytes, also reinstalled from their lockfile on
# Node 22 with no toolchain.
#
# The weekly bump workflow opens its pull request with a personal access token
# (FRAMERS_BUMP_TOKEN), so the pull request's own events start this workflow:
# GitHub holds the pull_request runs of a pull request that GITHUB_TOKEN opens
# until a maintainer approves them.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its run; a run started by hand waits for the
  # one before it on the same branch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The version deploy.yml builds with; its env block says why.
          node-version: '24'

      - name: Guard against pnpm-workspace contamination in lockfiles
        run: |
          set -e
          fail=0
          for f in package-lock.json src/dashboard/package-lock.json; do
            if [ ! -f "$f" ]; then continue; fi
            if grep -q 'node_modules/\.pnpm/' "$f"; then
              echo "::error file=$f::Lockfile contains 'node_modules/.pnpm/'. It was written inside a pnpm workspace and npm ci cannot install from it. Regenerate it with npm in a plain clone."
              fail=1
            fi
          done
          exit $fail

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript (engine + runtime)
        run: npm run build

      # Times the executor forged code runs in (QuickJS, an instance a call):
      # the first load, creating an executor, and 1,000 calls of a small forged
      # tool, with the process's memory read across the calls and a second
      # after the last. It prints the figures to the log and the job summary
      # and sets no pass bar; it fails only when a call does not return the
      # tool's result. A measurement for review, so deploy.yml does not run it.
      - name: Measure the forged-code executor
        run: node --expose-gc scripts/measure-forged-code-executor.mjs

      - name: Install dashboard dependencies
        run: cd src/dashboard && npm ci

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Run tests
        run: npm test

      # Packs the package, installs the tarball into an empty project, starts
      # paracosm-dashboard and requests the landing page, the dashboard and
      # their assets (scripts/smoke-packed-package.mjs).
      - name: Check the packed package
        run: npm run check:package

      # The same check on Node 22 in an image with no make, compiler or Python,
      # after reinstalling the project from the lockfile its install wrote with
      # npm ci, as deploy.yml's package-check runs it before a publish.
      - name: Check the packed package reinstalled from its lockfile on Node 22 with no toolchain
        run: |
          node scripts/pack-dashboard.mjs
          mkdir -p "$RUNNER_TEMP/package"
          tarball=$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/package" \
            | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename)")
          docker run --rm \
            -v "$RUNNER_TEMP/package:/package:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            node:22-bookworm-slim \
            node /scripts/smoke-packed-package.mjs --tarball "/package/$tarball" --reinstall-from-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: PDF upload end-to-end test
        run: npx playwright test tests-e2e/specs/pdf-upload.spec.ts --project=chromium-desktop

      - name: Run control end-to-end test
        run: npx playwright test tests-e2e/specs/run-control.spec.ts --project=chromium-desktop

      - name: Admin token field end-to-end test
        run: npx playwright test tests-e2e/specs/admin-token-field.spec.ts --project=chromium-desktop

      - name: Scenario per visitor end-to-end test
        run: npx playwright test tests-e2e/specs/scenario-per-visitor.spec.ts --project=chromium-desktop

      - name: Digital Twin events end-to-end test
        run: npx playwright test tests-e2e/specs/digital-twin-events.spec.ts --project=chromium-desktop

      - name: Dashboard display end-to-end test
        run: npx playwright test tests-e2e/specs/dashboard-display.spec.ts --project=chromium-desktop

      - name: Run status events end-to-end test
        run: npx playwright test tests-e2e/specs/run-status-events.spec.ts --project=chromium-desktop

      - name: Run per visitor end-to-end test
        run: npx playwright test tests-e2e/specs/run-per-visitor.spec.ts --project=chromium-desktop

      - name: Chat threads per run end-to-end test
        run: npx playwright test tests-e2e/specs/chat-per-run.spec.ts --project=chromium-desktop

      - name: Load link end-to-end test
        run: npx playwright test tests-e2e/specs/load-link.spec.ts --project=chromium-desktop

      - name: Toolbox log key and share link end-to-end test
        run: npx playwright test tests-e2e/specs/toolbox-log-and-share-link.spec.ts --project=chromium-desktop

      # The pictures that spec takes of each press at 390 and 1440 in both looks.
      - name: Upload the toolbox log key and share link pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolbox-log-and-share-link-pictures
          path: test-pictures/toolbox-log-and-share-link/
          if-no-files-found: ignore
          retention-days: 14

      - name: Check doc examples compile against package
        run: npm run check:doc-examples

      - name: Build API docs (TypeDoc)
        run: npm run docs

      - name: Check the sitemap against the API docs
        run: npm run check:sitemap

      # The hosted demo's consent bar on the landing page, the dashboard and
      # the API docs the step above built, against a server of its own in
      # hosted_demo mode with made-up analytics ids. It writes pictures of the
      # bar into test-results/consent-bar-captures.
      - name: Consent bar end-to-end test
        run: npx playwright test tests-e2e/specs/consent-bar.spec.ts --project=chromium-desktop

      - name: Upload the consent bar pictures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consent-bar-captures
          path: test-results/consent-bar-captures/
          if-no-files-found: ignore
          retention-days: 14

  # The install the server runs after a deploy, as deploy.yml's server-install
  # job runs it: the production dependencies from the lockfile on Node 22, in
  # an image with no make, compiler or Python.
  server-install:
    name: Server install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: node:22-bookworm-slim
    steps:
      # The image has no git; checkout downloads the commit through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install production dependencies from the lockfile, as the server does
        run: npm ci --omit=dev --no-audit --no-fund

      # The forged-code executor needs two QuickJS packages that AgentOS lists
      # only as optional peers. This loads QuickJS from what the server
      # installs, on the server's Node, and measures it there.
      - name: Load and measure the forged-code executor from the production install
        run: node --expose-gc scripts/measure-forged-code-executor.mjs

  # deploy.yml copies the build to the host with rsync --delete. This runs that
  # command's filter options against a stand-in host tree and fails when a
  # deploy would delete data the server writes there, or keep a stale build file.
  # It then runs the deploy step with stand-in rsync and ssh and fails when the
  # step copies while APP_DIR is empty, / or relative, when the copy and the
  # remote script use different directories, or when the remote script changes
  # the host's APP_DIR.
  deploy-keeps-host-data:
    name: Deploy keeps host data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the deploy's rsync filter against a stand-in host
        run: sudo bash scripts/check-deploy-keeps-host-data.sh

  deploy-pins-host-key:
    name: Deploy pins the host key
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the loopback SSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - name: Check the pinned host key on loopback
        run: sudo bash scripts/check-deploy-pins-host-key.sh

  compiled-server:
    name: Compiled server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install without lifecycle scripts and compile the server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/typescript/bin/tsc -p tsconfig.build.json

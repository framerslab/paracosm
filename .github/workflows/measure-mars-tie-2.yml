name: Measure Mars tie 2

on:
  push:
    branches: ['measure/mars-tie-2']
  workflow_dispatch: {}

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Measure round 3
        run: npx tsx scripts/measure-mars-tie-2c.ts

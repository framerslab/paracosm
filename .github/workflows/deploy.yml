name: Build, Deploy & Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

# A run in progress finishes before the next one starts: cancelling it could stop the
# Linode deploy or npm publish halfway. A newer pending run replaces an older one.
concurrency:
  group: deploy
  cancel-in-progress: false

# Read only: build, server-install and package-check run dependency code
# (install scripts, tsc, Vite). publish asks for what it writes.
permissions:
  contents: read

env:
  # Node 24 ships npm 11.x which matches the developer-machine npm that
  # authors lockfile updates. Pinning Node 22 (npm 10.x) caused the
  # lockfile-sync preflight to fail on every push because npm 10 and
  # npm 11 disagree on transitive entries (`@tailwindcss/oxide-wasm32-wasi`
  # bundled deps) and `peer: true` markers on optional peers.
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # Verify lockfiles are in sync with package.json. Emits ANNOTATIONS
      # only (no hard fail) because re-resolving `npm install
      # --package-lock-only` on CI's Linux x64 can legitimately produce
      # drift against a lockfile authored on macOS arm64 — optional
      # platform-specific deps (e.g. `@tailwindcss/oxide-wasm32-wasi`
      # bundled children, native `fsevents` vs `@rollup/rollup-linux-*`)
      # resolve differently per platform even when package.json hasn't
      # changed. The authoritative check is `npm ci` below: it hard-fails
      # on REAL desync (missing/added top-level deps) but tolerates
      # platform churn. This preflight catches common dependabot-style
      # real desync and surfaces it as a GitHub annotation for the PR
      # author to fix, without blocking the deploy when only platform
      # variance is in play. Recipe was added originally for PR #264,
      # #310; kept as warn-only after #312/#313/#314 showed platform
      # drift false-positives.
      - name: Verify lockfiles are in sync with package.json (warn-only)
        run: |
          set +e
          check() {
            local dir="$1"
            local label="$2"
            pushd "$dir" >/dev/null
            npm install --package-lock-only --no-audit --no-fund --ignore-scripts >/dev/null 2>&1
            if ! git diff --quiet package-lock.json; then
              echo "::warning file=${dir}/package-lock.json::${label} package-lock.json drift detected (may be platform-specific — npm ci will fail if real desync)."
              echo "::warning file=${dir}/package-lock.json::To resync: cd ${dir} && npm install --package-lock-only && git add package-lock.json && git commit -m 'chore(deps): sync lockfile' && git push"
              echo ""
              echo "--- drift in ${dir}/package-lock.json (warn) ---"
              git diff package-lock.json | head -40
              # Restore the committed lockfile so the subsequent npm ci
              # runs against the committed state, not the re-resolved one.
              git checkout -- package-lock.json
            fi
            popd >/dev/null
          }
          check "." "Root"
          check "src/dashboard" "Dashboard"

      - name: Guard against pnpm-workspace contamination in lockfiles
        run: |
          set -e
          fail=0
          for f in package-lock.json src/dashboard/package-lock.json; do
            if [ ! -f "$f" ]; then continue; fi
            if grep -q 'node_modules/\.pnpm/' "$f"; then
              echo "::error file=$f::Lockfile contains 'node_modules/.pnpm/' substring. This means it was authored from inside a pnpm workspace and references parent paths that do not exist in CI. To repair: copy package.json to a directory outside any pnpm workspace, run 'npm install' there, copy the resulting package-lock.json back, commit, push."
              fail=1
            fi
          done
          exit $fail

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript (engine + runtime)
        run: npm run build

      - name: Install dashboard dependencies
        run: cd src/dashboard && npm ci

      - name: Build dashboard
        run: npm run dashboard:build
        env:
          # The hosted demo's Google Analytics and Clarity ids, from the
          # GA_MEASUREMENT_ID and CLARITY_PROJECT_ID secrets. The dashboard's
          # build writes them into dist/site-analytics.json (the
          # site-analytics plugin in src/dashboard/vite.config.ts), and the
          # server hands them to the consent bar on every page it sends
          # (src/server/site-analytics.ts). To change an id, change its
          # secret; an empty secret writes an empty id, and the bar then
          # offers no switch for that tool.
          VITE_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}

      - name: Copy dashboard files for the compiled server
        run: node scripts/pack-dashboard.mjs

      - name: Run tests
        run: npm test

      - name: Check doc examples compile against package
        run: npm run check:doc-examples

      # Select the version once: publishing pushes use this run's release,
      # other pushes keep the current npm version. Deploy and package-check
      # take this same value, so /health and the published package agree once publish succeeds.
      - name: Select release version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR _ <<< "$CURRENT"
          NEXT="${MAJOR}.${MINOR}.${{ github.run_number }}"
          CHANGED=$(bash scripts/library-changed-since-release.sh)
          case "$CHANGED" in
            true) VERSION="$NEXT" ;;
            false) VERSION=$(npm view paracosm version 2>/dev/null || true); VERSION="${VERSION:-$NEXT}" ;;
            *) echo "::error::Expected a true or false publish decision"; exit 1 ;;
          esac
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release version"; exit 1; }
          export VERSION
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version=process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Docs and deploy will report version: $VERSION"

      - name: Build API docs (TypeDoc)
        run: |
          npm run docs
          cp assets/docs-theme/paracosm-override.css docs/api/assets/paracosm-override.css

      - name: Check the sitemap against the API docs
        run: npm run check:sitemap

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            dist/dashboard/
            src/dashboard/dist/
            docs/api/
          retention-days: 1

  # Compile the hosted server on its own runner, without install lifecycle
  # scripts or dashboard tools. Only this job supplies the server's JS.
  compiled-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install without lifecycle scripts and compile the server
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/typescript/bin/tsc -p tsconfig.build.json
      - name: Upload the compiled server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compiled-server
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # The install the server runs after a deploy (`npm ci --omit=dev` from the
  # repository lockfile, in deploy below), on Node 22 as production runs it,
  # in an image with no make, compiler or Python. npm builds a package from
  # its lockfile entry, which can need a toolchain where a fresh install does
  # not: better-sqlite3 13.0.3 got `node-gyp rebuild` from the lockfile and
  # the server's install failed on the missing make (run 38104598958, PR
  # #125). Deploy waits for this job, so such a dependency stops the deploy
  # instead of breaking the running site.
  server-install:
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    permissions:
      contents: read
    steps:
      # The image has no git; checkout downloads the commit through the API.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install production dependencies from the lockfile, as the server does
        run: npm ci --omit=dev --no-audit --no-fund

  deploy:
    needs: [build, server-install, compiled-server]
    runs-on: ubuntu-latest
    # SERVER_IP + APP_DIR resolved from GitHub Actions repo secrets so
    # deploy topology isn't encoded in the public workflow file. Set both
    # at repo → Settings → Secrets and variables → Actions → Secrets. Only
    # this job reads them; package-check starts the packed dashboard command,
    # whose state would otherwise go under APP_DIR.
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      APP_DIR: ${{ secrets.APP_DIR }}
    steps:
      - name: Check out the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: commit
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: built/

      - name: Download the compiled server
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compiled-server
          path: compiled/

      - name: Assemble deploy tree
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release version"; exit 1; }
          mkdir -p build
          for path in assets scenarios scripts src config package.json package-lock.json typedoc.json tsconfig.json tsconfig.build.json .env.example; do
            cp -a "commit/$path" "build/$path"
          done
          mkdir -p build/dist build/src/dashboard build/docs
          cp -a compiled/. build/dist/
          cp -a built/dist/dashboard build/dist/dashboard
          cp -a built/src/dashboard/dist build/src/dashboard/dist
          cp -a built/docs/api build/docs/api
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('build/package.json')); p.version=process.env.VERSION; fs.writeFileSync('build/package.json', JSON.stringify(p, null, 2) + '\n')"

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          : "${SERVER_IP:?SERVER_IP is not set}"
          : "${SERVER_HOST_KEY:?SERVER_HOST_KEY is not set}"
          [[ "$SERVER_HOST_KEY" =~ ^ssh-ed25519\ [A-Za-z0-9+/]+={0,3}$ ]] || { echo "::error::Expected one ed25519 host key"; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$SERVER_IP" "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  UserKnownHostsFile ~/.ssh/known_hosts\n  GlobalKnownHostsFile /dev/null\n  UpdateHostKeys no\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to Linode
        run: |
          # APP_DIR names the host directory rsync --delete copies into and the
          # directory the remote script starts the server from. An unset secret
          # reads as an empty string, and an empty, relative or dotted value
          # would point the copy at the host's / or somewhere else, so the step
          # stops before rsync unless it is an absolute path below /.
          : "${SERVER_IP:?SERVER_IP is not set}"
          app_dir="${APP_DIR%/}"
          case "$app_dir" in
            /*) ;;
            *) echo "::error::APP_DIR must be an absolute path other than /"; exit 1 ;;
          esac
          if [[ ! "$app_dir" =~ ^(/[A-Za-z0-9._-]+)+$ ]] || [[ "$app_dir/" == */./* || "$app_dir/" == */../* ]]; then
            echo "::error::APP_DIR must be an absolute path other than /, without . or .. parts"
            exit 1
          fi

          SSH="ssh -i ~/.ssh/deploy_key root@${SERVER_IP}"

          # Sync build to server.
          #
          # --delete removes paths on the server that aren't in the
          # artifact so old JS bundles + orphaned docs clean up on
          # each deploy. The excludes below are paths that DO NOT
          # belong in the artifact but MUST survive a deploy:
          #   .env              — hand-authored, holds API keys + caps.
          #   node_modules      — installed separately via npm ci.
          #   data/             — SQLite session store for cached runs.
          #                       Without this exclude, every deploy
          #                       wipes /opt/paracosm/data/sessions.db
          #                       because rsync sees it as "not in
          #                       source → delete it." The server
          #                       creates data/ on first boot and
          #                       owns its lifecycle from there.
          #   .event-buffer.json — transient SSE event buffer, written
          #                       per-run so the dashboard can rehydrate
          #                       after a restart. Regenerable.
          #   logs/             — runtime logs (pm2 stdout/stderr).
          #   output/           — RunArtifact JSONs persisted per
          #                       completed sim. data/runs.db points
          #                       at these files via record.artifactPath;
          #                       without this exclude, every deploy
          #                       wiped output/*.json and Library tab
          #                       drawers showed "Artifact file
          #                       unreadable" 410 errors for every run
          #                       that survived in runs.db across the
          #                       deploy. The server's run-artifact
          #                       writer owns the file lifecycle.
          # The rules below start with / so each matches one path at the
          # top of APP_DIR and nothing of the same name deeper in the build:
          #   /scenarios/compiled/: scenarios people compiled from a brief
          #                       (src/cli/persisted-compiled-scenarios.ts).
          #                       Only this subfolder: the bundled
          #                       scenarios/*.json beside it belong to the
          #                       build, and one the build drops is deleted.
          #   /.paracosm/: the compiler's hook cache
          #                       (.paracosm/cache/), which rebuilds each
          #                       compiled scenario at boot without an LLM
          #                       call.
          #   /.live-runs/: finished runs held for their visitors
          #                       across a restart (src/server/live-runs.ts).
          #   /.rate-limit.json, /.rate-limit.json.tmp: per-IP limits,
          #                       kept so a deploy is no fresh quota.
          #   /.retry-stats.json: the retry, forge and cache stats ring.
          # scripts/check-deploy-keeps-host-data.sh runs these options
          # against a stand-in host in CI. Never add --delete-excluded:
          # it deletes the excluded paths too.
          rsync -azP --delete --chown=root:root \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='data/' \
            --exclude='.event-buffer.json' \
            --exclude='logs/' \
            --exclude='output/' \
            --exclude='/scenarios/compiled/' \
            --exclude='/.paracosm/' \
            --exclude='/.live-runs/' \
            --exclude='/.rate-limit.json' \
            --exclude='/.rate-limit.json.tmp' \
            --exclude='/.retry-stats.json' \
            -e "ssh -i ~/.ssh/deploy_key" \
            build/ "root@${SERVER_IP}:${app_dir}/"

          # Install production deps and restart, in the directory rsync copied
          # into: the first line the remote shell reads sets deploy_dir. The
          # server reads APP_DIR from its environment, so the script leaves
          # that name as the host has it.
          { printf "deploy_dir='%s'\n" "$app_dir"
          cat << 'REMOTE'
          set -e
          cd "$deploy_dir"

          # Install production dependencies
          npm ci --omit=dev --no-audit --no-fund || {
            echo "npm ci failed; retrying once in 15 s" >&2
            sleep 15
            npm ci --omit=dev --no-audit --no-fund
          }

          # Validate the account and state layout while the current process
          # is still serving. Preparation errors must precede the stop.
          if ! command -v curl >/dev/null; then
            echo "Dashboard readiness requires curl" >&2
            exit 1
          fi
          getent group paracosm >/dev/null || groupadd --system paracosm
          if ! id -u paracosm >/dev/null 2>&1; then
            useradd --system --gid paracosm --home-dir "$deploy_dir" --no-create-home --shell /usr/sbin/nologin paracosm
          fi
          [ "$(id -u paracosm)" -ne 0 ]
          [ "$(getent group paracosm | cut -d: -f3)" -ne 0 ]
          for file in .rate-limit.json .rate-limit.json.tmp .event-buffer.json; do
            target=".paracosm/$file"
            [ ! -L "$target" ]
            [ ! -e "$target" ] || [ -f "$target" ]
            if [ -L "$file" ]; then
              [ "$(readlink "$file")" = "$target" ]
            else
              [ ! -e "$file" ] || [ -f "$file" ]
            fi
          done

          # Only runtime state belongs to the app. Source, dependencies and
          # the application directory stay owned by root after rsync.
          mkdir -p data/scenarios output .live-runs scenarios/compiled .paracosm
          touch .retry-stats.json
          for file in .rate-limit.json .rate-limit.json.tmp; do
            touch ".paracosm/$file"
          done
          chown -hR paracosm:paracosm data output .live-runs scenarios/compiled .paracosm
          chown paracosm:paracosm .retry-stats.json
          if [ -f .env ]; then
            chown root:paracosm .env
            chmod 640 .env
          fi

          # Read deployment settings as the server user, with the dashboard's
          # shell precedence and first nonempty .env value.
          port=$(runuser -u paracosm -- node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const settings = { APP_DIR: process.env.APP_DIR, PORT: process.env.PORT, HOST: process.env.HOST };
            for (const line of fs.readFileSync(".env", "utf8").split("\n")) {
              const entry = line.match(/^\s*([^#=]+?)\s*=\s*(.+?)\s*$/);
              if (entry && Object.hasOwn(settings, entry[1]) && !settings[entry[1]]) {
                settings[entry[1]] = entry[2];
              }
            }
            if (path.resolve(settings.APP_DIR || ".") !== process.cwd()) {
              console.error("APP_DIR must resolve to the deploy directory");
              process.exit(1);
            }
            if (!["", "0.0.0.0", "127.0.0.1", "localhost"].includes((settings.HOST || "").trim())) {
              console.error("Dashboard HOST must allow loopback readiness checks");
              process.exit(1);
            }
            const port = parseInt(settings.PORT || "3456", 10);
            if (!(port > 0 && port <= 65535)) throw new Error("Invalid dashboard PORT");
            console.log(port);
          ' </dev/null)
          version=$(node -p "require('./package.json').version" </dev/null)

          timeout 120 runuser -u paracosm -- node -e "
            import('./dist/server/server-app.js').then(
              () => process.exit(0),
              error => { console.error(error); process.exit(1); }
            )
          " </dev/null
          echo "Trial load passed for version $version on port $port"

          # Stop before moving state, so the prior process finishes writing.
          # Atomic saves and legacy-buffer cleanup use the writable targets;
          # the aliases in the application directory stay in place.
          pm2 delete paracosm 2>/dev/null || true
          for file in .rate-limit.json .rate-limit.json.tmp .event-buffer.json; do
            target=".paracosm/$file"
            if [ "$file" = .event-buffer.json ] && [ ! -f "$file" ] && [ ! -f "$target" ]; then
              if [ -L "$file" ]; then rm "$file" </dev/null; fi
              continue
            fi
            if [ ! -L "$file" ]; then
              if [ -f "$file" ]; then mv "$file" "$target"; fi
              ln -s "$target" "$file"
            fi
            chown -h paracosm:paracosm "$file"
          done
          # Include any files the old process wrote during shutdown.
          chown -hR paracosm:paracosm data output .live-runs scenarios/compiled .paracosm

          log_dir="${PM2_HOME:-$HOME/.pm2}/logs"
          error_log="$log_dir/paracosm-error.log"
          error_bytes=0
          if [ -f "$error_log" ]; then error_bytes=$(wc -c <"$error_log"); fi

          # Restart with pm2. The host sits behind Cloudflare, which sets
          # CF-Connecting-IP to the client's address on every request, so
          # the per-IP limits key on that header; without the setting they
          # key on the connection's address, the local proxy's. pm2 start
          # passes this shell's environment to the app, and pm2 save keeps
          # it for a restart after a reboot.
          # PARACOSM_ALLOWED_ORIGINS lists the demo's own pages, so a browser that sends no Sec-Fetch-Site is not judged by the Host the proxy passes.
          PARACOSM_SCENARIO_STORE_DIR="$deploy_dir/data/scenarios" \
          PARACOSM_CLIENT_IP_HEADER=cf-connecting-ip PARACOSM_ALLOWED_ORIGINS=https://paracosm.agentos.sh pm2 start dist/cli/serve.js \
            --name paracosm \
            --uid paracosm --gid paracosm \
            --max-memory-restart 1200M \
            --env production

          deadline=$(( $(date +%s) + 60 ))
          attempt=1
          while :; do
            if health=$(curl -fsS --max-time 2 "http://127.0.0.1:$port/health" </dev/null 2>/dev/null) &&
              node -e 'try { process.exitCode = Number(JSON.parse(process.argv[1]).version !== process.argv[2]); } catch { process.exitCode = 1; }' "$health" "$version" </dev/null; then
              echo "Readiness passed for version $version on port $port"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ] || [ "$attempt" -ge 31 ]; then
              echo "Dashboard did not serve version $version on port $port" >&2 </dev/null
              if [ -f "$error_log" ]; then
                tail -c "+$((error_bytes + 1))" "$error_log" | tail -n 80 >&2
              fi
              echo "Full logs on the host are in $log_dir" >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 2 </dev/null
          done

          # Ensure pm2 resurrects the app after a reboot. Without this
          # systemd unit, a host reboot (Linode maintenance) brings nginx
          # back but leaves the app dead, so nginx returns 502 until
          # someone manually runs `pm2 resurrect`. Idempotent: re-running
          # on an already-configured box just re-asserts the enabled unit.
          pm2 startup systemd -u root --hp /root
          pm2 save

          echo "Paracosm deployed and running"
          REMOTE
          } | $SSH

  # Builds and packs the tarball publish ships, and checks those bytes, away
  # from the publish job's tokens. Building runs dependency code (install
  # scripts, tsc, Vite), and the checks install the tarball into an empty
  # project, where npm resolves every dependency afresh and runs their install
  # scripts, so a dependency release published inside a semver range runs
  # here: a job with a read-only token, no stored git credentials and no
  # secrets, on its own runner. The tarball is hashed and uploaded before
  # anything installs it; publish checks the hash and ships it as it is.
  package-check:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    outputs:
      library_changed: ${{ steps.changes.outputs.library_changed }}
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags, which the publish decision compares with.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A push that publishes nothing (no shipped file changed since the last
      # release tag) skips the rest, and publish publishes nothing.
      - name: Does this push publish?
        id: changes
        run: |
          verdict=$(bash scripts/library-changed-since-release.sh)
          echo "library_changed=$verdict" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.changes.outputs.library_changed == 'true'
        run: npm ci

      - name: Build
        if: steps.changes.outputs.library_changed == 'true'
        run: npm run build

      - name: Install dashboard dependencies
        if: steps.changes.outputs.library_changed == 'true'
        run: cd src/dashboard && npm ci

      # Without analytics settings, unlike the build job's, so a dashboard run
      # from the npm package reports to no analytics.
      - name: Build the dashboard the package ships
        if: steps.changes.outputs.library_changed == 'true'
        run: npm run dashboard:build

      # major.minor from package.json, the workflow run number as the patch:
      # always unique, with no commit back. publish tags and announces it.
      - name: Version from the run number
        if: steps.changes.outputs.library_changed == 'true'
        id: version
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release version"; exit 1; }
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json')); p.version=process.env.VERSION; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packing ${VERSION} (run #${{ github.run_number }})"

      # The prepack copy (scripts/pack-dashboard.mjs), then npm pack with
      # scripts off, which runs only this repository's code and npm.
      - name: Pack the package publish ships
        if: steps.changes.outputs.library_changed == 'true'
        id: pack
        run: |
          node scripts/pack-dashboard.mjs
          mkdir -p "$RUNNER_TEMP/package"
          tarball=$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/package" \
            | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename)")
          sha256=$(sha256sum "$RUNNER_TEMP/package/$tarball" | cut -d ' ' -f 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball, SHA-256 $sha256"

      - name: Upload the tarball
        if: steps.changes.outputs.library_changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

      # Installed into an empty project, paracosm-dashboard must serve the landing
      # page, the dashboard, its bundle and their assets (scripts/smoke-packed-package.mjs).
      - name: Check the packed package
        if: steps.changes.outputs.library_changed == 'true'
        run: node scripts/smoke-packed-package.mjs --tarball "$RUNNER_TEMP/package/${{ steps.pack.outputs.tarball }}"

      # The same check on Node 22, the oldest the package supports, in an image
      # with no make, compiler or Python, after reinstalling the project from the
      # lockfile its install wrote with npm ci: the install of a user who commits
      # a lockfile. npm builds from a lockfile entry what a fresh install takes
      # prebuilt in some cases (better-sqlite3 13.0.3, run 38104598958).
      - name: Check it reinstalled from its lockfile on Node 22 with no toolchain
        if: steps.changes.outputs.library_changed == 'true'
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/package:/package:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            node:22-bookworm-slim \
            node /scripts/smoke-packed-package.mjs --tarball "/package/${{ steps.pack.outputs.tarball }}" --reinstall-from-lockfile

  # Publishes the tarball package-check built and checked, and runs no code
  # from a dependency: no install, no build, no package script. Its tokens
  # (the write token, the npm token, and the OIDC token npm trusted
  # publishing exchanges for a publish token) are never beside an install
  # script or a build tool; those run in package-check.
  publish:
    needs: [build, package-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    # contents: the GitHub release; actions: the run it
    # dispatches when master's head has no run of its own.
    permissions:
      contents: write
      actions: write
      # npm trusted publishing exchanges this job's OIDC token for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history needed so scripts/generate-changelog.mjs can walk
          # every package.json version boundary. Prior requirement was
          # only the previous-commit diff (fetch-depth: 2) for library-
          # change detection.
          fetch-depth: 0
          # No stored token: the steps that call GitHub get it in their own
          # environment.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # Skip the rest of the publish job when the commit changes nothing the
      # npm package ships: a docs, test or workflow change cuts no version.
      # scripts/detect-library-change.mjs holds the rule and its tests
      # (tests/scripts/detect-library-change.test.ts).
      - name: Detect library changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKED: ${{ needs.package-check.outputs.library_changed }}
        run: |
          # A newer commit on master has its own run, which publishes everything since the
          # last release, so this run publishes only while it is master's head.
          git fetch -q origin master
          if [ "$(git rev-parse origin/master)" != "$(git rev-parse HEAD)" ]; then
            echo "library_changed=false" >> "$GITHUB_OUTPUT"
            HEAD_SHA=$(git rev-parse origin/master)
            # A [skip ci] commit has no run of its own. When master's head has none, dispatch one on
            # master: it waits for this run (the deploy group) and publishes everything since the
            # last release. If the lookup fails, assume the head has a run, as before.
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?head_sha=$HEAD_SHA" \
              --jq .total_count 2>/dev/null || echo 1)
            if [ "$RUNS" = 0 ]; then
              gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref master
              echo "master has moved to $HEAD_SHA, which has no run of its own; dispatched one, which publishes."
            else
              echo "master has moved past this commit; the run for the newer commit publishes."
            fi
            exit 0
          fi
          # Compare with the commit the last release was published from, not only the
          # parent: a run that a later push replaced published nothing, and its changes
          # must reach the next run that publishes. This workflow tags each release
          # v<major>.<minor>.<run number>; with no release tag, publish.
          # scripts/library-changed-since-release.sh holds that comparison; the
          # package-check job runs it too. The step's shell exits on a failed
          # command, so a script error stops the job here.
          VERDICT=$(bash scripts/library-changed-since-release.sh)
          case "$VERDICT" in
            true)
              # The tarball comes from package-check, which made the same comparison.
              # When it found nothing to publish (a release tag made or deleted between
              # the two jobs, or this job re-run alone), no checked tarball exists.
              if [ "$CHECKED" != "true" ]; then
                echo "::error::A shipped file changed since the last release, but package-check found nothing to publish and checked no tarball. Re-run the whole workflow."
                exit 1
              fi
              echo "library_changed=true" >> "$GITHUB_OUTPUT"
              echo "A shipped file changed — will publish."
              ;;
            false)
              echo "library_changed=false" >> "$GITHUB_OUTPUT"
              echo "No shipped file changed — skipping npm publish + GitHub release."
              ;;
            *)
              echo "::error::library-changed-since-release.sh printed '$VERDICT', expected true or false."
              exit 1
              ;;
          esac

      - name: Download the checked tarball
        if: steps.changes.outputs.library_changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/package

      # The bytes package-check hashed, of the version it packed. The release
      # notes read the version from package.json.
      - name: Verify the tarball and take its version
        if: steps.changes.outputs.library_changed == 'true'
        id: version
        env:
          TARBALL: ${{ runner.temp }}/package/${{ needs.package-check.outputs.tarball }}
          SHA256: ${{ needs.package-check.outputs.sha256 }}
          VERSION: ${{ needs.package-check.outputs.version }}
        run: |
          echo "${SHA256}  ${TARBALL}" | sha256sum --check --strict -
          PACKED=$(tar -xzOf "$TARBALL" package/package.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)")
          if [ "$PACKED" != "$VERSION" ]; then
            echo "::error::The tarball holds version ${PACKED}, not ${VERSION}."
            exit 1
          fi
          node -e "const p=require('./package.json'); p.version=process.env.VERSION; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} (run #${{ github.run_number }})"

      # A deploy run never writes to master: its protection requires checks that a commit
      # made here would not have. Each release's changes live in its GitHub release notes,
      # written here to release-notes.md. The script also rewrites CHANGELOG.md in this
      # workspace, where nothing reads it: the tarball comes from package-check and does
      # not ship that file.
      # The copy on master changes by pull request (CONTRIBUTING.md says when).
      - name: Generate release notes
        if: steps.changes.outputs.library_changed == 'true'
        run: node scripts/generate-changelog.mjs

      # The checked tarball as it is, with scripts off. Trusted publishing
      # needs npm 11.5.1 or later, which Node 24 ships.
      - name: Publish to npm
        if: steps.changes.outputs.library_changed == 'true'
        run: |
          echo "npm $(npm --version)"
          npm publish "$TARBALL" --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ runner.temp }}/package/${{ needs.package-check.outputs.tarball }}

      - name: Create GitHub Release
        if: steps.changes.outputs.library_changed == 'true'
        run: |
          # The tag marks the commit this job published, which the next run's change
          # detection compares with.
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "$(git rev-parse HEAD)" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

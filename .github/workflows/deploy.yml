name: Build, Deploy & Publish

on:
  push:
    branches: [master]
  workflow_dispatch:

# A run in progress finishes before the next one starts: cancelling it could stop the
# Linode deploy or npm publish halfway. A newer pending run replaces an older one.
concurrency:
  group: deploy
  cancel-in-progress: false

# Read only: build, server-install and package-check run dependency code
# (install scripts, tsc, Vite). publish asks for what it writes.
permissions:
  contents: read

env:
  # Node 24 ships npm 11.x which matches the developer-machine npm that
  # authors lockfile updates. Pinning Node 22 (npm 10.x) caused the
  # lockfile-sync preflight to fail on every push because npm 10 and
  # npm 11 disagree on transitive entries (`@tailwindcss/oxide-wasm32-wasi`
  # bundled deps) and `peer: true` markers on optional peers.
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # Verify lockfiles are in sync with package.json. Emits ANNOTATIONS
      # only (no hard fail) because re-resolving `npm install
      # --package-lock-only` on CI's Linux x64 can legitimately produce
      # drift against a lockfile authored on macOS arm64 — optional
      # platform-specific deps (e.g. `@tailwindcss/oxide-wasm32-wasi`
      # bundled children, native `fsevents` vs `@rollup/rollup-linux-*`)
      # resolve differently per platform even when package.json hasn't
      # changed. The authoritative check is `npm ci` below: it hard-fails
      # on REAL desync (missing/added top-level deps) but tolerates
      # platform churn. This preflight catches common dependabot-style
      # real desync and surfaces it as a GitHub annotation for the PR
      # author to fix, without blocking the deploy when only platform
      # variance is in play. Recipe was added originally for PR #264,
      # #310; kept as warn-only after #312/#313/#314 showed platform
      # drift false-positives.
      - name: Verify lockfiles are in sync with package.json (warn-only)
        run: |
          set +e
          check() {
            local dir="$1"
            local label="$2"
            pushd "$dir" >/dev/null
            npm install --package-lock-only --no-audit --no-fund --ignore-scripts >/dev/null 2>&1
            if ! git diff --quiet package-lock.json; then
              echo "::warning file=${dir}/package-lock.json::${label} package-lock.json drift detected (may be platform-specific — npm ci will fail if real desync)."
              echo "::warning file=${dir}/package-lock.json::To resync: cd ${dir} && npm install --package-lock-only && git add package-lock.json && git commit -m 'chore(deps): sync lockfile' && git push"
              echo ""
              echo "--- drift in ${dir}/package-lock.json (warn) ---"
              git diff package-lock.json | head -40
              # Restore the committed lockfile so the subsequent npm ci
              # runs against the committed state, not the re-resolved one.
              git checkout -- package-lock.json
            fi
            popd >/dev/null
          }
          check "." "Root"
          check "src/dashboard" "Dashboard"

      - name: Guard against pnpm-workspace contamination in lockfiles
        run: |
          set -e
          fail=0
          for f in package-lock.json src/dashboard/package-lock.json; do
            if [ ! -f "$f" ]; then continue; fi
            if grep -q 'node_modules/\.pnpm/' "$f"; then
              echo "::error file=$f::Lockfile contains 'node_modules/.pnpm/' substring. This means it was authored from inside a pnpm workspace and references parent paths that do not exist in CI. To repair: copy package.json to a directory outside any pnpm workspace, run 'npm install' there, copy the resulting package-lock.json back, commit, push."
              fail=1
            fi
          done
          exit $fail

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript (engine + runtime)
        run: npm run build

      - name: Install dashboard dependencies
        run: cd src/dashboard && npm ci

      - name: Build dashboard
        run: npm run dashboard:build
        env:
          # Vite inlines these at build time as `import.meta.env.VITE_*`.
          # Empty values short-circuit Analytics.tsx so the build still
          # works without secrets configured (local fork / fresh clone).
          # The hosted server gives the landing page and the API docs the
          # same two ids from src/server/site-analytics.ts: change both.
          VITE_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}

      - name: Run tests
        run: npm test

      - name: Check doc examples compile against package
        run: npm run check:doc-examples

      # The build job's checkout has the dev-floor version (0.9.0) from
      # package.json. package-check sets 0.9.${run_number} in its own
      # checkout before it packs, so the build job never sees the published
      # version. typedoc has `includeVersion: true` and reads
      # package.json directly, which is why early v0.8 deploys advertised
      # "v0.8.0" while npm shipped 0.8.${prev_run_number}.
      #
      # Query the npm registry for the latest published version and use
      # it for typedoc. Most commits are UI-only (publish skipped) — for
      # these, docs match npm exactly. Library commits drift docs behind
      # by exactly one publish (build runs npm view BEFORE publish bumps
      # the patch), and the next workflow run converges. Falling back to
      # the run-number form when npm is unreachable so the docs deploy
      # never produces a literal "0.9.0" again.
      - name: Sync version for docs
        run: |
          LATEST=$(npm view paracosm version 2>/dev/null || true)
          if [ -z "$LATEST" ]; then
            LATEST="0.9.${{ github.run_number }}"
            echo "npm view failed; falling back to ${LATEST}"
          fi
          node -e "const p=require('./package.json'); p.version='${LATEST}'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "Docs will report version: ${LATEST}"

      - name: Build API docs (TypeDoc)
        run: |
          npm run docs
          cp assets/docs-theme/paracosm-override.css docs/api/assets/paracosm-override.css

      - name: Check the sitemap against the API docs
        run: npm run check:sitemap

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            dist/
            src/dashboard/dist/
            docs/api/
            assets/
            scenarios/
            scripts/
            package.json
            package-lock.json
            src/
            config/
            typedoc.json
            tsconfig.json
            tsconfig.build.json
            .env.example
          retention-days: 1

  # The install the server runs after a deploy (`npm ci --omit=dev` from the
  # repository lockfile, in deploy below), on Node 22 as production runs it,
  # in an image with no make, compiler or Python. npm builds a package from
  # its lockfile entry, which can need a toolchain where a fresh install does
  # not: better-sqlite3 13.0.3 got `node-gyp rebuild` from the lockfile and
  # the server's install failed on the missing make (run 38104598958, PR
  # #125). Deploy waits for this job, so such a dependency stops the deploy
  # instead of breaking the running site.
  server-install:
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    permissions:
      contents: read
    steps:
      # The image has no git; checkout downloads the commit through the API.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install production dependencies from the lockfile, as the server does
        run: npm ci --omit=dev --no-audit --no-fund

  deploy:
    needs: [build, server-install]
    runs-on: ubuntu-latest
    # SERVER_IP + APP_DIR resolved from GitHub Actions repo secrets so
    # deploy topology isn't encoded in the public workflow file. Set both
    # at repo → Settings → Secrets and variables → Actions → Secrets. Only
    # this job reads them; package-check starts the packed dashboard command,
    # whose state would otherwise go under APP_DIR.
    env:
      SERVER_IP: ${{ secrets.SERVER_IP }}
      APP_DIR: ${{ secrets.APP_DIR }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to Linode
        run: |
          SSH="ssh -i ~/.ssh/deploy_key root@${{ env.SERVER_IP }}"

          # Sync build to server.
          #
          # --delete removes paths on the server that aren't in the
          # artifact so old JS bundles + orphaned docs clean up on
          # each deploy. The excludes below are paths that DO NOT
          # belong in the artifact but MUST survive a deploy:
          #   .env              — hand-authored, holds API keys + caps.
          #   node_modules      — installed separately via npm ci.
          #   data/             — SQLite session store for cached runs.
          #                       Without this exclude, every deploy
          #                       wipes /opt/paracosm/data/sessions.db
          #                       because rsync sees it as "not in
          #                       source → delete it." The server
          #                       creates data/ on first boot and
          #                       owns its lifecycle from there.
          #   .event-buffer.json — transient SSE event buffer, written
          #                       per-run so the dashboard can rehydrate
          #                       after a restart. Regenerable.
          #   logs/             — runtime logs (pm2 stdout/stderr).
          #   output/           — RunArtifact JSONs persisted per
          #                       completed sim. data/runs.db points
          #                       at these files via record.artifactPath;
          #                       without this exclude, every deploy
          #                       wiped output/*.json and Library tab
          #                       drawers showed "Artifact file
          #                       unreadable" 410 errors for every run
          #                       that survived in runs.db across the
          #                       deploy. The server's run-artifact
          #                       writer owns the file lifecycle.
          rsync -azP --delete \
            --exclude='.env' \
            --exclude='node_modules' \
            --exclude='data/' \
            --exclude='.event-buffer.json' \
            --exclude='logs/' \
            --exclude='output/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            build/ root@${{ env.SERVER_IP }}:${{ env.APP_DIR }}/

          # Install production deps and restart
          $SSH << 'REMOTE'
          set -e
          cd /opt/paracosm

          # Install production dependencies
          npm ci --omit=dev 2>/dev/null || npm install --omit=dev

          # Restart with pm2
          pm2 delete paracosm 2>/dev/null || true
          pm2 start "npx tsx src/cli/serve.ts" \
            --name paracosm \
            --max-memory-restart 3G \
            --env production

          # Ensure pm2 resurrects the app after a reboot. Without this
          # systemd unit, a host reboot (Linode maintenance) brings nginx
          # back but leaves the app dead, so nginx returns 502 until
          # someone manually runs `pm2 resurrect`. Idempotent: re-running
          # on an already-configured box just re-asserts the enabled unit.
          pm2 startup systemd -u root --hp /root
          pm2 save

          echo "Paracosm deployed and running"
          REMOTE

  # Builds and packs the tarball publish ships, and checks those bytes, away
  # from the publish job's tokens. Building runs dependency code (install
  # scripts, tsc, Vite), and the checks install the tarball into an empty
  # project, where npm resolves every dependency afresh and runs their install
  # scripts, so a dependency release published inside a semver range runs
  # here: a job with a read-only token, no stored git credentials and no
  # secrets, on its own runner. The tarball is hashed and uploaded before
  # anything installs it; publish checks the hash and ships it as it is.
  package-check:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    outputs:
      library_changed: ${{ steps.changes.outputs.library_changed }}
      version: ${{ steps.version.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The release tags, which the publish decision compares with.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # A push that publishes nothing (no shipped file changed since the last
      # release tag) skips the rest, and publish publishes nothing.
      - name: Does this push publish?
        id: changes
        run: |
          verdict=$(bash scripts/library-changed-since-release.sh)
          echo "library_changed=$verdict" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.changes.outputs.library_changed == 'true'
        run: npm ci

      - name: Build
        if: steps.changes.outputs.library_changed == 'true'
        run: npm run build

      - name: Install dashboard dependencies
        if: steps.changes.outputs.library_changed == 'true'
        run: cd src/dashboard && npm ci

      # Without analytics settings, unlike the build job's, so a dashboard run
      # from the npm package reports to no analytics.
      - name: Build the dashboard the package ships
        if: steps.changes.outputs.library_changed == 'true'
        run: npm run dashboard:build

      # major.minor from package.json, the workflow run number as the patch:
      # always unique, with no commit back. publish tags and announces it.
      - name: Version from the run number
        if: steps.changes.outputs.library_changed == 'true'
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR _ <<< "$CURRENT"
          NEXT="${MAJOR}.${MINOR}.${{ github.run_number }}"
          node -e "const p=require('./package.json'); p.version='${NEXT}'; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Packing ${NEXT} (run #${{ github.run_number }})"

      # The prepack copy (scripts/pack-dashboard.mjs), then npm pack with
      # scripts off, which runs only this repository's code and npm.
      - name: Pack the package publish ships
        if: steps.changes.outputs.library_changed == 'true'
        id: pack
        run: |
          node scripts/pack-dashboard.mjs
          mkdir -p "$RUNNER_TEMP/package"
          tarball=$(npm pack --json --ignore-scripts --pack-destination "$RUNNER_TEMP/package" \
            | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].filename)")
          sha256=$(sha256sum "$RUNNER_TEMP/package/$tarball" | cut -d ' ' -f 1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Packed $tarball, SHA-256 $sha256"

      - name: Upload the tarball
        if: steps.changes.outputs.library_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ runner.temp }}/package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

      # Installed into an empty project, paracosm-dashboard must serve the landing
      # page, the dashboard, its bundle and their assets (scripts/smoke-packed-package.mjs).
      - name: Check the packed package
        if: steps.changes.outputs.library_changed == 'true'
        run: node scripts/smoke-packed-package.mjs --tarball "$RUNNER_TEMP/package/${{ steps.pack.outputs.tarball }}"

      # The same check on Node 22, the oldest the package supports, in an image
      # with no make, compiler or Python, after reinstalling the project from the
      # lockfile its install wrote with npm ci: the install of a user who commits
      # a lockfile. npm builds from a lockfile entry what a fresh install takes
      # prebuilt in some cases (better-sqlite3 13.0.3, run 38104598958).
      - name: Check it reinstalled from its lockfile on Node 22 with no toolchain
        if: steps.changes.outputs.library_changed == 'true'
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/package:/package:ro" \
            -v "$GITHUB_WORKSPACE/scripts:/scripts:ro" \
            node:22-bookworm-slim \
            node /scripts/smoke-packed-package.mjs --tarball "/package/${{ steps.pack.outputs.tarball }}" --reinstall-from-lockfile

  # Publishes the tarball package-check built and checked, and runs no code
  # from a dependency: no install, no build, no package script. Its tokens
  # (the write token, the npm token, and the OIDC token npm trusted
  # publishing exchanges for a publish token) are never beside an install
  # script or a build tool; those run in package-check.
  publish:
    needs: [build, package-check]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    # contents: the changelog push and the GitHub release; actions: the run it
    # dispatches when master's head has no run of its own.
    permissions:
      contents: write
      actions: write
      # npm trusted publishing exchanges this job's OIDC token for a publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed so scripts/generate-changelog.mjs can walk
          # every package.json version boundary. Prior requirement was
          # only the previous-commit diff (fetch-depth: 2) for library-
          # change detection.
          fetch-depth: 0
          # No stored token: the steps that push or call GitHub get it in
          # their own environment.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      # Skip the rest of the publish job when the commit changes nothing the
      # npm package ships: a docs, test or workflow change cuts no version.
      # scripts/detect-library-change.mjs holds the rule and its tests
      # (tests/scripts/detect-library-change.test.ts).
      - name: Detect library changes
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKED: ${{ needs.package-check.outputs.library_changed }}
        run: |
          # A newer commit on master has its own run, which publishes everything since the
          # last release, so this run publishes only while it is master's head. That also
          # keeps its changelog commit from being pushed onto a master that moved.
          git fetch -q origin master
          if [ "$(git rev-parse origin/master)" != "$(git rev-parse HEAD)" ]; then
            echo "library_changed=false" >> "$GITHUB_OUTPUT"
            HEAD_SHA=$(git rev-parse origin/master)
            # A [skip ci] commit has no run of its own. When master's head has none, dispatch one on
            # master: it waits for this run (the deploy group) and publishes everything since the
            # last release. If the lookup fails, assume the head has a run, as before.
            RUNS=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?head_sha=$HEAD_SHA" \
              --jq .total_count 2>/dev/null || echo 1)
            if [ "$RUNS" = 0 ]; then
              gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref master
              echo "master has moved to $HEAD_SHA, which has no run of its own; dispatched one, which publishes."
            else
              echo "master has moved past this commit; the run for the newer commit publishes."
            fi
            exit 0
          fi
          # Compare with the commit the last release was published from, not only the
          # parent: a run that a later push replaced published nothing, and its changes
          # must reach the next run that publishes. This workflow tags each release
          # v<major>.<minor>.<run number>; with no release tag, publish.
          # scripts/library-changed-since-release.sh holds that comparison; the
          # package-check job runs it too. The step's shell exits on a failed
          # command, so a script error stops the job here.
          VERDICT=$(bash scripts/library-changed-since-release.sh)
          case "$VERDICT" in
            true)
              # The tarball comes from package-check, which made the same comparison.
              # When it found nothing to publish (a release tag made or deleted between
              # the two jobs, or this job re-run alone), no checked tarball exists.
              if [ "$CHECKED" != "true" ]; then
                echo "::error::A shipped file changed since the last release, but package-check found nothing to publish and checked no tarball. Re-run the whole workflow."
                exit 1
              fi
              echo "library_changed=true" >> "$GITHUB_OUTPUT"
              echo "A shipped file changed — will publish."
              ;;
            false)
              echo "library_changed=false" >> "$GITHUB_OUTPUT"
              echo "No shipped file changed — skipping npm publish + GitHub release."
              ;;
            *)
              echo "::error::library-changed-since-release.sh printed '$VERDICT', expected true or false."
              exit 1
              ;;
          esac

      - name: Download the checked tarball
        if: steps.changes.outputs.library_changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package

      # The bytes package-check hashed, of the version it packed. The changelog
      # and the release notes read the version from package.json.
      - name: Verify the tarball and take its version
        if: steps.changes.outputs.library_changed == 'true'
        id: version
        env:
          TARBALL: ${{ runner.temp }}/package/${{ needs.package-check.outputs.tarball }}
          SHA256: ${{ needs.package-check.outputs.sha256 }}
          VERSION: ${{ needs.package-check.outputs.version }}
        run: |
          echo "${SHA256}  ${TARBALL}" | sha256sum --check --strict -
          PACKED=$(tar -xzOf "$TARBALL" package/package.json | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)")
          if [ "$PACKED" != "$VERSION" ]; then
            echo "::error::The tarball holds version ${PACKED}, not ${VERSION}."
            exit 1
          fi
          node -e "const p=require('./package.json'); p.version=process.env.VERSION; require('fs').writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION} (run #${{ github.run_number }})"

      - name: Generate CHANGELOG and release notes
        if: steps.changes.outputs.library_changed == 'true'
        run: node scripts/generate-changelog.mjs

      - name: Commit CHANGELOG if changed
        if: steps.changes.outputs.library_changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore: update CHANGELOG"
            # The header checkout would have stored, for this push alone.
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)
            echo "::add-mask::$AUTH"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:master
          else
            echo "CHANGELOG unchanged; no commit-back."
          fi

      # The checked tarball as it is, with scripts off. Trusted publishing
      # needs npm 11.5.1 or later, which Node 24 ships.
      - name: Publish to npm
        if: steps.changes.outputs.library_changed == 'true'
        run: |
          echo "npm $(npm --version)"
          npm publish "$TARBALL" --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ runner.temp }}/package/${{ needs.package-check.outputs.tarball }}

      - name: Create GitHub Release
        if: steps.changes.outputs.library_changed == 'true'
        run: |
          # The tag marks the commit this job published (the changelog commit when there
          # is one), which the next run's change detection compares with.
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "$(git rev-parse HEAD)" \
            --title "v${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

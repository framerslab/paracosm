name: Measure Mars tie 3

# Measurement only, for #234. Runs on pushes to its own branch and is never merged.
on:
  push:
    branches: ['measure/mars-tie-3']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  measure:
    name: Measure ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [base, v1, v2, v3, others]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Measure
        env:
          PART: ${{ matrix.part }}
        run: npx tsx scripts/measure-mars-tie-3.ts

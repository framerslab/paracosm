name: Measure Mars tie 3

# Measurement only, for #234. Runs on pushes to its own branch and is never merged.
on:
  push:
    branches: ['measure/mars-tie-3']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  policy-path:
    name: The supply reading through the policy step
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Measure
        run: npx tsx scripts/measure-policy-path.ts

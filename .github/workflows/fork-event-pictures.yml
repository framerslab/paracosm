name: Fork event pictures

on:
  pull_request:
    paths:
      - src/dashboard/src/components/reports/ForkModal*
      - tests-e2e/specs/scenario-per-visitor.spec.ts
      - .github/workflows/fork-event-pictures.yml

permissions:
  contents: read

concurrency:
  group: fork-event-pictures-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture fork event feedback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Capture the dialog in both looks
        env:
          FORK_EVENT_PICTURES: '1'
        run: |
          npm ci
          npm ci --prefix src/dashboard
          npx playwright install --with-deps chromium
          npx playwright test tests-e2e/specs/scenario-per-visitor.spec.ts --project=chromium-desktop --grep 'custom events must name a year'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-event-pictures-${{ github.event.pull_request.head.sha }}
          path: test-pictures/fork-events/
          if-no-files-found: error
          retention-days: 14

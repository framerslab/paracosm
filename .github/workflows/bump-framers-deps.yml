name: Bump @framers/* deps

# Temporary branch-only lockfile resolution; restored before review.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  lockfile:
    if: github.ref == 'refs/heads/chore/agentos-0.19.0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Resolve the updated manifest without install scripts
        run: npm install --package-lock-only --no-audit --no-fund --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: agentos-lockfile
          path: package-lock.json
          retention-days: 7
